spring.application.name=ai-hallucination-reviewer
server.port=8080

# H2 Database in file mode
spring.datasource.url=jdbc:h2:file:./data/ai_hallucination;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# GitHub Configuration (optional token for higher rate limits)
github.api.token=${GITHUB_TOKEN:}
